<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>물·소금물 가열·냉각 곡선과 밀도 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 태블릿 가로 화면 기준. 맨 위 탭, 그 아래 도구 한 줄, 안내 한 줄, 아래는 장치(왼쪽)와 그래프(오른쪽). 세로 화면에서는 위아래로 쌓음. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface2:#F4F7F8; --ink:#13232C; --muted:#56676F;
  --line:#D3DCE1; --line-strong:#9FB0B9;
  --hot:#C9461D; --hot-bg:#FBE9E2; --cold:#1D63A8; --cold-bg:#E3EEF8; --den:#0E7C80; --den-bg:#DDF1F1;
  --acc:var(--hot); --acc-bg:var(--hot-bg); --acc-ink:#FFFFFF;
  --warn:#7D5200; --warn-bg:#FBF0D6; --bad:#B3261E; --bad-bg:#FBE4E2;
  --grid:#BFCBD2; --plot-bg:#FFFFFF; --axis:#13232C;
  --c0:#1D63A8; --c1:#7A47B8; --c2:#1E8A5A; --c3:#C9461D; --c4:#B0307A;
  --glass:#5E7A88; --liq-water:#8EC9F0; --metal:#8A9AA3; --plate:#3B4A53; --plate-top:#5B6C76;
  --solid:#F4F6F7; --solid-ice:#CFEAF7; --table:#C9D3D8; --mix:#D6EAF4;
  --egg:#D98C4E; --egg-edge:#9B5A2B; --egg-hi:#F0B27A;
  --font-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono","D2Coding",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A20; --surface:#17252D; --surface2:#1C2D36; --ink:#E6EEF2; --muted:#9DB0BA;
    --line:#2B404B; --line-strong:#4A6574;
    --hot:#FF8F66; --hot-bg:#3A2219; --cold:#6DB2F0; --cold-bg:#16293A; --den:#4FD0D2; --den-bg:#133234; --acc-ink:#1B0E08;
    --warn:#F0C45A; --warn-bg:#35290F; --bad:#FF8A80; --bad-bg:#3A1C1A;
    --grid:#34505D; --plot-bg:#122027; --axis:#E6EEF2;
    --c0:#6DB2F0; --c1:#C39BF2; --c2:#5FD39B; --c3:#FF8F66; --c4:#F07AB5;
    --glass:#8FB0C0; --liq-water:#3F86B5; --metal:#6F838E; --plate:#0C1318; --plate-top:#33444E;
    --solid:#D9DFE2; --solid-ice:#8FC5DD; --table:#22333C; --mix:#2E4A5A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A20; --surface:#17252D; --surface2:#1C2D36; --ink:#E6EEF2; --muted:#9DB0BA;
  --line:#2B404B; --line-strong:#4A6574;
  --hot:#FF8F66; --hot-bg:#3A2219; --cold:#6DB2F0; --cold-bg:#16293A; --den:#4FD0D2; --den-bg:#133234; --acc-ink:#1B0E08;
  --warn:#F0C45A; --warn-bg:#35290F; --bad:#FF8A80; --bad-bg:#3A1C1A;
  --grid:#34505D; --plot-bg:#122027; --axis:#E6EEF2;
  --c0:#6DB2F0; --c1:#C39BF2; --c2:#5FD39B; --c3:#FF8F66; --c4:#F07AB5;
  --glass:#8FB0C0; --liq-water:#3F86B5; --metal:#6F838E; --plate:#0C1318; --plate-top:#33444E;
  --solid:#D9DFE2; --solid-ice:#8FC5DD; --table:#22333C; --mix:#2E4A5A;
  color-scheme:dark;
}
#app[data-tab="cool"]{ --acc:var(--cold); --acc-bg:var(--cold-bg); }
#app[data-tab="dens"]{ --acc:var(--den); --acc-bg:var(--den-bg); }
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:12px 24px;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0 auto 0 0;font-size:22px;line-height:1.25;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:48px;padding:8px 18px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-size:17px;font-weight:700}
.tabs button[aria-selected="true"]{border-color:var(--acc);background:var(--acc-bg)}
.btn{min-height:48px;padding:8px 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-weight:600}
.btn.sm{min-height:40px;padding:4px 12px;font-size:14px}
.btn[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-bg)}
.btn.armed{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
/* 도구 */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.tool{position:relative}
.tool .main{width:100%;min-height:98px;border:2px solid var(--line);background:var(--surface2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 4px 6px}
.tool .main[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-bg)}
.tool svg{width:44px;height:44px;flex:none;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool svg .w{fill:var(--liq-water);stroke:none} .tool svg .ic{fill:var(--solid-ice)}
.tool svg .p{fill:var(--solid)} .tool svg .m{fill:var(--metal)} .tool svg .eg{fill:var(--egg);stroke:var(--egg-edge)}
.tool .cap{font-size:11px;line-height:1.3;color:var(--muted);font-weight:500;margin-top:3px;word-break:keep-all}
.tool .nm{font-weight:700;font-size:15px;line-height:1.25;margin-top:2px;word-break:keep-all}
.tool .cnt{font-family:var(--font-num);font-size:13px;font-weight:600;color:var(--acc);min-height:20px}
.tool .main[aria-pressed="false"] .cnt{color:var(--muted);font-weight:500}
.tool .x{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;line-height:1;padding:0}
/* 안내 */
.guide{margin:0;min-height:50px;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--acc);font-size:18px;font-weight:600;display:flex;align-items:center}
.guide.warn{border-left-color:var(--warn);background:var(--warn-bg)}
/* 본문 */
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:10px;align-items:start}
.scenebox{background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scenebox svg{display:block;width:100%;height:auto;max-height:calc(100vh - 380px);min-height:230px}
.bar{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.bar[hidden]{display:none}
.read{display:flex;align-items:baseline;gap:4px;font-family:var(--font-num);font-weight:600}
.read .big{font-size:38px;line-height:1}
.read small{font-size:15px;color:var(--muted)}
.read.sm .big{font-size:24px}
.rlab{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:500;margin-right:2px}
.clock{font-family:var(--font-num);font-size:22px;font-weight:600;color:var(--muted)}
.spd{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.spd button{min-height:40px;min-width:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:600;font-family:var(--font-num)}
.spd button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-bg)}
.btn-go{flex:1 1 170px;min-height:56px;font-size:18px;font-weight:700;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn-go.on{background:var(--surface2);color:var(--ink);border-color:var(--ink)}
.safety{margin:10px 0 0;padding:6px 10px;border-left:5px solid var(--warn);background:var(--warn-bg);border-radius:6px;font-size:14px}
/* 장치 SVG */
.sc-table{fill:var(--table)} .sc-plate-body{fill:var(--plate)} .sc-plate-top{fill:var(--plate-top)}
.sc-led{fill:var(--line-strong)} .sc-led.on{fill:#FF4B3A} .sc-knob{fill:var(--plate-top);stroke:var(--line-strong);stroke-width:1.5}
.sc-glow{fill:#FF7A3C;transition:opacity .3s}
.sc-glass{fill:none;stroke:var(--glass);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.sc-fin{fill:var(--surface2)}
.sc-liq{fill:var(--liq-water);opacity:.85}
.sc-bath{fill:var(--mix)} .sc-cube{fill:var(--solid-ice);stroke:var(--glass);stroke-width:1;opacity:.95} .sc-dot{fill:#fff;opacity:.9}
.sc-chip{fill:var(--ink);opacity:.6}
.sc-sbody{fill:#33444E} .sc-sscreen{fill:#A7E8C3} .sc-sline{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.sc-cable{stroke:var(--ink);stroke-width:2;fill:none;opacity:.6}
.sc-solid{fill:var(--solid);stroke:var(--glass);stroke-width:1} .sc-solid.ice{fill:var(--solid-ice)}
.sc-lbl{fill:#fff;font-size:12px;font-weight:700}
.sc-steam{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;opacity:0}
.sc-bub{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.5;opacity:0}
.boiling .sc-bub{opacity:1;animation:rise 1.1s linear infinite}
.boiling .sc-steam{animation:steam 1.8s ease-in-out infinite}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-44px);opacity:0}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
@media (prefers-reduced-motion: reduce){
  .boiling .sc-bub,.boiling .sc-steam{animation:none}
  .boiling .sc-steam{opacity:.5}
}
/* 밀도 장면 */
.sc-egg{fill:url(#eggGrad);stroke:var(--egg-edge);stroke-width:1.5}
.sc-dliq{fill:var(--liq-water);opacity:.5}
.sc-surf{stroke:var(--glass);stroke-width:2;opacity:.7}
.sc-salt{fill:#F6F8F9;stroke:var(--line-strong);stroke-width:1}
.sc-tick{stroke:var(--glass);stroke-width:1.5} .sc-ticktxt{fill:var(--muted);font-size:11px;font-family:var(--font-num)}
/* 그래프 */
.gtools{display:flex;gap:8px;margin-bottom:8px;min-height:0}
.gtools:empty{display:none}
.gwrap{border:1px solid var(--line);border-radius:10px;background:var(--plot-bg);overflow:hidden}
.gwrap svg{display:block;width:100%;height:auto;max-height:calc(100vh - 330px);min-height:260px}
.g-bg{fill:var(--plot-bg)} .g-major{stroke:var(--grid);stroke-width:1.2} .g-axis{stroke:var(--axis);stroke-width:2}
.g-ref{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 5} .g-reftxt{fill:var(--muted);font-size:12.5px;font-weight:600;text-anchor:end}
.g-tick{fill:var(--ink);font-size:13px;font-family:var(--font-num)} .g-title{fill:var(--ink);font-size:14px;font-weight:600}
.g-tag{font-size:13px;font-weight:700} .g-tagbg{fill:var(--plot-bg);stroke-width:2;opacity:.95}
.g-run{fill:none;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.g-curve{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:2 0}
#side{margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td.num{font-family:var(--font-num)}
.tbl .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tbl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);padding:0;font-size:13px}
.empty,.tnote,.legend{margin:6px 2px 0;color:var(--muted);font-size:13.5px}
.legend{font-weight:600}
.notes summary{cursor:pointer;font-weight:700;font-size:16px;padding:4px 2px}
.notes ul{margin:8px 0 2px;padding-left:20px;font-size:14.5px}
.notes li{margin:3px 0}
.foot{margin-top:6px;padding:14px 8px 4px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .scenebox svg,.gwrap svg{max-height:none}
}
@media (max-width:520px){
  h1{font-size:19px}
  .tabs button{padding:8px 10px;font-size:15px}
  .tools{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="app" id="app" data-tab="heat">
  <header class="top">
    <h1>🧂 물·소금물 가열·냉각 곡선과 밀도 실험실</h1>
    <div class="tabs" role="tablist" aria-label="실험 종류">
      <button role="tab" data-tab="heat" aria-selected="true" type="button">가열 곡선</button>
      <button role="tab" data-tab="cool" aria-selected="false" type="button">냉각 곡선</button>
      <button role="tab" data-tab="dens" aria-selected="false" type="button">밀도 (달걀)</button>
    </div>
    <button id="resetAll" class="btn" type="button">전체 초기화</button>
  </header>

  <section class="card" aria-label="실험 도구"><div class="tools" id="tools"></div></section>
  <p class="guide" id="guide" role="status" aria-live="polite"></p>

  <main class="cols">
    <section class="card" aria-label="실험 장치">
      <div class="scenebox"><svg id="scene" viewBox="0 0 420 340" role="img" aria-label="실험 장치 그림"></svg></div>
      <div class="bar" id="barT">
        <div class="read" aria-label="온도 센서 값"><span class="big" id="tNow">--.-</span><small>℃</small></div>
        <div class="clock" id="timeNow" aria-label="경과 시간">00:00</div>
        <div class="spd" role="group" aria-label="재생 속도">배속
          <button type="button" data-spd="0">×1</button><button type="button" data-spd="1">×2</button><button type="button" data-spd="2">×4</button>
        </div>
        <button class="btn btn-go" id="go" type="button">가열장치 켜기</button>
      </div>
      <div class="bar" id="barD" hidden>
        <div class="read sm"><span class="rlab">농도</span><span class="big" id="dW">--</span><small>%</small></div>
        <div class="read sm"><span class="rlab">밀도</span><span class="big" id="dRho">--</span><small>g/mL</small></div>
        <div class="read sm"><span class="rlab">달걀</span><span class="big" id="dEgg" style="font-family:var(--font-body);font-size:20px">--</span></div>
      </div>
      <p class="safety" id="safety"></p>
    </section>
    <section class="card" aria-label="그래프">
      <div class="gtools" id="gtools"></div>
      <div class="gwrap"><svg id="graph" role="img" aria-label="그래프"></svg></div>
      <div id="side"></div>
    </section>
  </main>
  <details class="card notes" id="notes"><summary>📘 실험 해설과 과학적 근거</summary><div id="notesBody"></div></details>
  <footer class="foot">중학교 과학 · 물질의 특성 (끓는점·어는점·밀도)<br>©수민T의 과학 실험실. All rights reserved.</footer>
</div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

/*PHYS-START*/
/* ===== 물리 상수 · 실제 자료 (값을 바꾸려면 여기만 수정) ===== */
var ROOM=20, MASS=100, SALTSTEP=5, SALTMAX=20, TMAX=20, BASE=0.5, SPD=[1,2,4]; /* 용액 100 g, 소금 5 g씩(최대 20 g), 실험 20분, 화면 1초=실험 0.5분(배속 가능) */
var NACL=58.44, KB=0.512;                 /* NaCl 몰질량(g/mol), 물의 끓는점 오름 상수(℃·kg/mol) */
var P_HEAT=60, FC=70, L_VAP=2257;         /* 가열 열량(W), 플라스크 열용량(J/℃), 물의 증발열(J/g) */
var HA=3, TBATH=-20, L_FUS=334, C_ICE=2.1;/* 냉각조로 빠져나가는 열의 세기(W/℃), 냉각조 온도(℃), 얼음 융해열(J/g), 얼음 비열(J/g·℃) */
var EGG_RHO=1.08, EGG_V=55, SOLUB=0.359;  /* 달걀 밀도(g/mL), 달걀 부피(mL), 20 ℃ 물 1 g에 녹는 NaCl 최대량(g) */
/* NaCl 수용액의 삼투 계수 φ (몰랄농도 m별, 100 ℃ 부근). 끓는점 오름 ΔTb = 2·φ·Kb·m */
var PHI=[[0,.90],[0.5,.92],[1,.94],[2,.99],[3,1.04],[4,1.09],[5,1.15],[6,1.21],[8,1.33],[10,1.45]];
/* NaCl 수용액의 어는점 (질량 % → ℃), 화학 핸드북 값. 23.3 %가 공융점(-21.1 ℃) */
var TF=[[0,0],[2,-1.2],[4,-2.5],[6,-3.7],[8,-5.1],[10,-6.5],[12,-8.2],[14,-9.9],[16,-12.2],[18,-14.4],[20,-16.5],[22,-19.0],[23.3,-21.1]];
/* NaCl 수용액의 밀도 (질량 % → g/mL, 20 ℃), 화학 핸드북 값 */
var RHO=[[0,.9982],[2,1.0125],[4,1.0268],[6,1.0413],[8,1.0559],[10,1.0707],[12,1.0857],[14,1.1009],[16,1.1162],[18,1.1319],[20,1.1478],[22,1.1640],[24,1.1804],[26,1.1972]];
function lin(tab,x){
  var n=tab.length,i,a,b;
  if(x<=tab[0][0]) return tab[0][1];
  if(x>=tab[n-1][0]) return tab[n-1][1];
  for(i=1;i<n;i++){ if(x<=tab[i][0]){a=tab[i-1];b=tab[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])} }
}
function cSol(w){return 4.18*(1-0.0095*w)}              /* 소금물의 비열(J/g·℃): 10 % ≈ 3.8, 20 % ≈ 3.4 */
function wtPct(salt,water){return salt/(salt+water)*100}
function bpOf(salt,water){var m=salt/NACL/(water/1000);return 100+2*lin(PHI,m)*KB*m}
function tfOf(salt,water){return lin(TF,wtPct(salt,water))}
function firstIdx(T,fn){for(var i=0;i<T.length;i++){if(fn(T[i]))return i}return -1}

/* 가열: 1초 간격 에너지 계산. 끓는 동안 물만 증발 → 남은 소금물이 진해져 끓는점이 서서히 올라감 */
function simHeat(salt){
  var N=TMAX*60+1, T=new Float32Array(N), ph=new Uint8Array(N), fr=new Float32Array(N);
  var water0=MASS-salt, wRem=water0, temp=ROOM, state=0, bp0=bpOf(salt,water0), i;
  for(i=0;i<N;i++){
    T[i]=temp; ph[i]=state; fr[i]=(salt+wRem)/MASS;
    if(state===0){ temp+=P_HEAT/(MASS*cSol(wtPct(salt,water0))+FC); if(temp>=bp0){temp=bp0;state=1} }
    else { wRem-=P_HEAT/L_VAP; temp=bpOf(salt,wRem) }
  }
  var i1=firstIdx(T,function(v){return v>=30}), i2=firstIdx(T,function(v){return v>=80});
  return {T:T,ph:ph,fr:fr,i1:i1,i2:i2,slope:50/((i2-i1)/60),tC:firstIdx(ph,function(v){return v===1}),key:bp0};
}
/* 냉각: 냉각조(-20 ℃)로 빠져나가는 열 = HA×(온도차) (뉴턴의 냉각 법칙).
   어는 동안에는 순수한 얼음만 생기므로 남은 소금물이 진해지고, 어는점이 계속 내려감 */
function simCool(salt){
  var N=TMAX*60+1, T=new Float32Array(N), ph=new Uint8Array(N), fr=new Float32Array(N);
  var water0=MASS-salt, temp=ROOM, state=0, ice=0, tf0=tfOf(salt,water0), Q, i;
  for(i=0;i<N;i++){
    T[i]=temp; ph[i]=state; fr[i]=ice/MASS;
    Q=HA*(temp-TBATH);
    if(state===0){ temp-=Q/(MASS*cSol(wtPct(salt,water0))+FC); if(temp<=tf0){temp=tf0;state=1} }
    else if(state===1){
      ice+=Q/L_FUS;
      if(ice>=water0){ice=water0;state=2;temp=tf0}
      else temp=Math.max(TBATH+0.01,tfOf(salt,water0-ice));
    } else { temp-=Q/(MASS*C_ICE+FC); if(temp<TBATH)temp=TBATH }
  }
  var i1=firstIdx(T,function(v){return v<=15}), i2=firstIdx(T,function(v){return v<=5}), tC=firstIdx(ph,function(v){return v===1});
  return {T:T,ph:ph,fr:fr,i1:i1,i2:i2,slope:10/((i2-i1)/60),tC:tC,key:tf0};
}

var FLOOR=312, PXML=0.6, EA=25, EB=33;
var A={cy:300,ang:0,yL:FLOOR,init:false};
function capX(f){var lo=0,hi=2,m,i;for(i=0;i<30;i++){m=(lo+hi)/2;if(m*m*(3-m)/4<f)lo=m;else hi=m}return (lo+hi)/2}
function halfH(deg){var r=deg*Math.PI/180;return Math.sqrt(EB*EB*Math.cos(r)*Math.cos(r)+EA*EA*Math.sin(r)*Math.sin(r))}
function densCalc(){
  var d=S.sel.dens, c={water:d.water,w:0,rho:0,st:'none',f:1,dis:0,und:0,V:0,mound:0};
  if(!d.water) return c;
  var sat=SOLUB*d.water;
  c.dis=Math.min(d.salt,sat); c.und=d.salt-c.dis;
  c.w=c.dis/(c.dis+d.water)*100; c.rho=lin(RHO,c.w);
  if(d.egg){
    var diff=c.rho-EGG_RHO;
    if(diff<-0.004) c.st='sink';
    else if(diff<=0.004) c.st='mid';
    else {c.st='float';c.f=EGG_RHO/c.rho}
  }
  c.V=(d.water+c.dis)/c.rho+(d.egg?EGG_V*(c.st==='float'?c.f:1):0);
  c.mound=Math.min(18,c.und*0.6);
  return c;
}
function densTarget(){
  var d=S.sel.dens, c=densCalc(), fl=FLOOR-c.mound;
  var t={yL:c.water?FLOOR-c.V*PXML:FLOOR, ang:0, cy:fl-EB, sink:false};
  if(!d.egg) return t;
  if(c.st==='sink'||c.st==='none'){ t.sink=true; t.ang=64; t.cy=fl-halfH(64); }
  else if(c.st==='mid'){
    var lo=t.yL+EB+2, hi=fl-EB;
    t.cy=hi<lo?hi:Math.min(hi,Math.max(lo,(t.yL+fl)/2));
  } else {
    var x=capX(c.f);
    t.cy=Math.min(fl-EB,t.yL+x*EB-EB);
  }
  return t;
}

function tagW(txt){var w=14,i;for(i=0;i<txt.length;i++)w+=txt.charCodeAt(i)>255?13.5:7.8;return Math.round(w)}
function placeTags(){
  if(S.tab==='dens') return;
  var g=geom(), items=[];
  tabRuns().forEach(function(r){
    var el=$('#rg'+r.id); if(!el) return;
    var w=tagW(runName(r)), ex=gx(r.t,g), ey=gy(tempAt(r,r.t),g);
    var x=Math.max(G.ml+4,Math.min(G.ml+g.W-w-4,ex-w-10)), y=Math.max(G.mt+4,Math.min(G.mt+g.H-26,ey-30));
    items.push({el:el,w:w,x:x,y:y});
  });
  items.sort(function(a,b){return a.y-b.y});
  items.forEach(function(it,i){
    for(var j=0;j<i;j++){
      var o=items[j];
      if(it.x<o.x+o.w+4&&o.x<it.x+it.w+4&&Math.abs(it.y-o.y)<26) it.y=o.y+26;
    }
    it.y=Math.min(it.y,G.mt+g.H-26);
    var rc=it.el.firstChild, tx=it.el.lastChild;
    rc.setAttribute('x',it.x.toFixed(1));rc.setAttribute('y',it.y.toFixed(1));rc.setAttribute('width',it.w);
    tx.setAttribute('x',(it.x+7).toFixed(1));tx.setAttribute('y',(it.y+15).toFixed(1));
  });
}

  else h='<ul>'+
    '<li><b>밀도 = 질량 ÷ 부피</b>: 같은 부피일 때 질량이 클수록 밀도가 커요. 물에 소금을 녹이면 부피는 거의 그대로인데 질량은 늘어나요. 그래서 소금을 넣을수록 소금물의 밀도가 커져요. (물 약 1.00 g/mL, 10 % 소금물 약 1.07 g/mL, 20 % 소금물 약 1.15 g/mL)</li>'+
    '<li><b>뜨고 가라앉는 조건</b>: 달걀의 밀도가 소금물보다 크면 가라앉고, 거의 같으면 물속에 떠 있고, 달걀의 밀도가 소금물보다 작으면 위로 떠올라요. 소금을 계속 넣으면 달걀이 가라앉음 → 물속에 떠 있음 → 떠오름 순서로 변해요.</li>'+
    '<li><b>달걀의 밀도</b>: 이 실험에서는 약 1.08 g/mL로 정했어요. 소금물의 농도가 약 11 %일 때 소금물의 밀도와 거의 같아져서 달걀이 물속에 떠 있어요. 실제 달걀은 신선할수록 밀도가 커서, 신선도에 따라 결과가 조금 달라질 수 있어요.</li>'+
    '<li><b>소금이 더 안 녹아요(포화)</b>: 20 ℃의 물 100 g에는 소금이 약 36 g까지만 녹아요. 그보다 많이 넣으면 녹지 못한 소금이 컵 바닥에 쌓여요. 이때 소금물의 농도는 약 26 %이고, 이보다 진해지지 않아요.</li></ul>';
  $('#notesBody').innerHTML=h;
}
function updateSmart(){
  if(S.tab==='dens'){
    var c=densCalc(), d=S.sel.dens;
    $('#dW').textContent=c.water?c.w.toFixed(1):'--';
    $('#dRho').textContent=c.water?c.rho.toFixed(3):'--';
    $('#dEgg').textContent=d.egg?(c.water?STN[c.st]:'바닥에 놓임'):'--';
    return;
  }
  var s=sel(), run=shownRun();
  var T=run?tempAt(run,run.t):ROOM;
  $('#tNow').textContent=s.sensor?fmtT(T):'--.-';
  $('#timeNow').textContent=fmtClock(run?run.t:0);
}
function renderControls(){
  var b=$('#go'), heat=S.tab==='heat';
  b.textContent=S.running?(heat?'가열장치 끄기':'측정 끝내기'):(heat?'가열장치 켜기':'냉각 시작');
  b.classList.toggle('on',S.running);
  b.disabled=!S.running&&(!ready()||dupRun());
  [].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.setAttribute('aria-selected',String(x.dataset.tab===S.tab))});
  [].forEach.call(document.querySelectorAll('.spd button'),function(x){x.setAttribute('aria-pressed',String(+x.dataset.spd===S.spd))});
}
function renderAll(){
  $('#app').setAttribute('data-tab',S.tab);
  var dens=S.tab==='dens';
  $('#barT').hidden=dens; $('#barD').hidden=!dens;
  if(dens) recordDens();
  renderTools(); renderGuide(); renderSafety(); renderScene();
  updateSmart(); renderGTools(); drawGraph(); renderRuns(); renderControls(); renderNotes();
}
function refocus(q){var n=document.querySelector(q);if(n&&!n.disabled)n.focus()}

/* ===== 실험 시작 · 진행 ===== */
function startRun(){
  if(!ready()||dupRun()) return;
  var s=sel();
  var run={id:++S.uid,tab:S.tab,salt:s.salt,ci:s.salt/SALTSTEP,t:0,lastPh:''};
  run.sim=S.tab==='heat'?simHeat(s.salt):simCool(s.salt);
  S.runs.push(run); S.cur=run; S.running=true; S.note='';
  renderAll();
}
function stopRun(auto){
  S.running=false;
  S.note=auto?'정해진 시간(20분)이 끝나 측정이 끝났어요.':'';
  renderAll();
}
var last=performance.now();
function frame(ts){
  var dt=Math.min(0.1,Math.max(0,(ts-last)/1000));
  last=ts;
  if(S.running&&S.cur&&S.cur.tab===S.tab){
    var r=S.cur;
    r.t=Math.min(TMAX,r.t+dt*BASE*SPD[S.spd]);
    updateLive(); updateScene(); updateSmart();
    var pn=phaseOf(r,r.t).name;
    if(pn!==r.lastPh){r.lastPh=pn;renderGuide()}
    if(!r.sl&&reached(r,r.sim.i2)){r.sl=true;renderRuns()}
    if(!r.kp&&r.sim.tC>=0&&reached(r,r.sim.tC)){r.kp=true;renderRuns()}
    if(r.t>=TMAX-1e-9) stopRun(true);
  }
  if(S.tab==='dens'){stepAnim(dt);updateDensScene()}
  requestAnimationFrame(frame);
}

/* ===== 이벤트 ===== */
$('.tabs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-tab]'); if(!b||b.dataset.tab===S.tab) return;
  if(S.running){S.note='실험 중에는 바꿀 수 없어요. 먼저 멈춰요.';renderGuide();return}
  S.tab=b.dataset.tab; S.note='';
  renderAll();
});
function clickLab(id,isX,s){
  if(isX){ if(id==='water'){s.water=0;s.salt=0} else if(id==='salt') s.salt=0; return '' }
  if(id==='flask'){ if(s.flask){s.flask=0;s.water=0;s.salt=0;s.sensor=0;s.chip=0} else s.flask=1; return '' }
  if(id==='bath'){ s.bath=s.bath?0:1; return '' }
  if(!s.flask) return '먼저 삼각플라스크를 올려 주세요.';
  if(id==='water'){ if(s.water) return '물은 이미 들어 있어요. 빼려면 ✕를 눌러요.'; s.water=1; return '' }
  if(id==='salt'){
    if(!s.water) return '먼저 물을 넣어 주세요.';
    if(s.salt>=SALTMAX) return '이 실험에서는 소금을 '+SALTMAX+' g(농도 '+SALTMAX+' %)까지 넣을 수 있어요.';
    s.salt+=SALTSTEP; return '';
  }
  if(id==='sensor'||id==='chip'){ s[id]=s[id]?0:1; return '' }
  return '';
}
function clickDens(id,isX,s){
  if(isX){ if(id==='water'){s.water=0;s.salt=0} else if(id==='salt') s.salt=0; return '' }
  if(id==='cup'){ if(s.cup){s.cup=0;s.water=0;s.salt=0;s.egg=0;A.init=false} else s.cup=1; return '' }
  if(!s.cup) return '먼저 유리컵을 놓아 주세요.';
  if(id==='water'){
    if(s.water>=300) return '컵에 물이 가득해요. (최대 300 g)';
    s.water=s.water?s.water+50:200; return '';
  }
  if(id==='salt'){
    if(!s.water) return '먼저 컵에 물을 넣어 주세요.';
    if(s.salt>=80) return '소금이 충분해요. 더 넣어도 녹지 않아요.';
    s.salt+=5; return '';
  }
  if(id==='egg'){ if(s.egg) s.egg=0; else {s.egg=1;A.init=true;A.cy=20;A.ang=0} return '' }
  return '';
}
$('#tools').addEventListener('click',function(e){
  if(S.running) return;
  var b=e.target.closest('button'); if(!b) return;
  var id=b.dataset.tool||b.dataset.x; if(!id) return;
  var s=sel();
  S.note=S.tab==='dens'?clickDens(id,!!b.dataset.x,s):clickLab(id,!!b.dataset.x,s);
  renderAll(); refocus('[data-tool="'+id+'"]');
});
$('#go').addEventListener('click',function(){ if(S.running) stopRun(false); else startRun() });
document.querySelector('.spd').addEventListener('click',function(e){
  var b=e.target.closest('button[data-spd]'); if(!b) return;
  S.spd=+b.dataset.spd; renderControls();
});
$('#gtools').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.id==='gz'){S.zoom=!S.zoom;renderGTools();drawGraph()}
  if(b.id==='ge'){S.eggLine=!S.eggLine;renderGTools();drawGraph()}
});
$('#side').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.del){
    var id=b.dataset.del;
    S.runs=S.runs.filter(function(r){return String(r.id)!==id});
    if(S.cur&&String(S.cur.id)===id) S.cur=null;
    renderAll();
  }
  if(b.dataset.clearlog){S.dlog=[];renderRuns();drawGraph()}
});
var armTimer=null;
$('#resetAll').addEventListener('click',function(){
  var b=this;
  if(!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent='한 번 더 누르세요';
    armTimer=setTimeout(function(){b.classList.remove('armed');b.textContent='전체 초기화'},3500);
    return;
  }
  clearTimeout(armTimer); b.classList.remove('armed'); b.textContent='전체 초기화';
  S.running=false; S.cur=null; S.runs=[]; S.note=''; S.dlog=[]; A.init=false;
  S.sel={heat:{flask:0,water:0,salt:0,sensor:0,chip:0},cool:{flask:0,water:0,salt:0,sensor:0,bath:0},dens:{cup:0,water:0,salt:0,egg:0}};
  renderAll();
});

renderAll();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
